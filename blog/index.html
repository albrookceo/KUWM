<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog · Keeping up with Marcus</title>
  <meta name="description" content="Hot takes, white papers, and posts from Marcus.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="shared.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
  <style>
    .intro {
      font-size: 1.3rem;
      margin: 0 0 32px;
    }
    .home-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 0 0 40px;
    }
    .home-actions a {
      font-weight: 700;
      font-size: 18px;
      text-transform: uppercase;
      text-decoration: none;
      padding: 12px 20px;
      background: var(--black);
      color: var(--white);
    }
    .home-actions a.secondary {
      background: var(--white);
      color: var(--black);
      border: 2px solid var(--black);
    }
    .latest h2 {
      font-size: 1.4rem;
      text-transform: uppercase;
      margin: 0 0 12px;
    }
    .latest-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .latest-list li {
      border-top: 2px solid var(--black);
      padding: 14px 0;
    }
    .latest-list a {
      font-size: 1.3rem;
      font-weight: 700;
      text-transform: uppercase;
      text-decoration: none;
    }
    .latest-list a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="logo-block" href="../">
      <span class="logo-main">KEEPING UP WITH MARCUS</span>
      <span class="logo-sub">DEN &rarr; PHX &rarr; ATX &rarr; NYC</span>
    </a>
  </header>

  <main class="page">
    <h1>Blog</h1>
    <p class="intro">Hot takes, white papers, and notes from Marcus on the move.</p>

    <nav class="home-actions" aria-label="Blog">
      <a href="posts/">Read all posts</a>
      <a id="write-link" class="secondary" href="new/" hidden>Write a post</a>
    </nav>

    <section class="latest">
      <h2>Latest</h2>
      <ul id="latest-list" class="latest-list"></ul>
      <p id="latest-empty" class="empty" hidden>No posts yet.</p>
    </section>

    <p id="account" class="meta"></p>
    <p id="status" class="status" role="status"></p>
  </main>

  <script type="module">
    import { supabase } from "../js/supabase.js";

    const latestList = document.getElementById("latest-list");
    const latestEmpty = document.getElementById("latest-empty");
    const accountEl = document.getElementById("account");
    const statusEl = document.getElementById("status");
    const writeLink = document.getElementById("write-link");

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value;
      return div.innerHTML;
    }

    const { data: sessionData } = await supabase.auth.getSession();
    const session = sessionData.session;

    if (session) {
      accountEl.textContent = `Signed in as ${session.user.email}.`;
      writeLink.hidden = false;
    } else {
      accountEl.innerHTML = `<a href="../login/">Sign in</a> to read member posts.`;
    }

    // Anonymous visitors only see public posts; members also see members-only posts.
    const { data, error } = await supabase
      .from("posts")
      .select("id, title, created_at, visibility")
      .order("created_at", { ascending: false })
      .limit(5);

    if (error) {
      statusEl.textContent = error.message;
      statusEl.classList.add("error");
    } else if (data.length === 0) {
      latestEmpty.hidden = false;
    } else {
      latestList.innerHTML = data
        .map((post) => {
          const date = new Date(post.created_at).toLocaleDateString(undefined, {
            year: "numeric",
            month: "long",
            day: "numeric",
          });
          const badge = post.visibility === "members" ? ` <span class="badge">Members</span>` : "";
          return `<li>
            <a href="posts/#post-${post.id}">${escapeHtml(post.title)}</a>${badge}
            <p class="meta">${date}</p>
          </li>`;
        })
        .join("");
    }
  </script>
</body>
</html>
