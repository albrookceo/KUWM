<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Write a post · Keeping up with Marcus</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../shared.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="logo-block" href="../../">
      <span class="logo-main">KEEPING UP WITH MARCUS</span>
      <span class="logo-sub">ATX</span>
    </a>
    <button id="signout" class="logo-block signout-block" type="button" hidden>
      <span class="logo-main">SIGN OUT</span>
    </button>
  </header>

  <main class="page">
    <h1>Write a post</h1>

    <div id="signed-out" hidden>
      <p><a href="../../login/?next=blog">Sign in</a> to write a post.</p>
    </div>

    <form id="post-form" hidden>
      <div class="field">
        <label for="title">Title</label>
        <input id="title" type="text" required maxlength="200">
      </div>
      <div class="field">
        <label for="body">Body</label>
        <textarea id="body" required></textarea>
      </div>
      <div class="field">
        <label for="visibility">Who can read it</label>
        <select id="visibility">
          <option value="public">Public: anyone can read</option>
          <option value="members">Members only</option>
        </select>
      </div>
      <button id="publish" class="button" type="submit">Publish</button>
    </form>

    <p id="status" class="status" role="status"></p>
  </main>

  <script type="module">
    import { supabase } from "../../js/supabase.js";
    import { setupSignOut } from "../../js/signout.js";
    setupSignOut(document.getElementById("signout"));

    const signedOut = document.getElementById("signed-out");
    const form = document.getElementById("post-form");
    const publish = document.getElementById("publish");
    const statusEl = document.getElementById("status");

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle("error", isError);
    }

    const { data } = await supabase.auth.getSession();
    const session = data.session;

    if (!session) {
      signedOut.hidden = false;
    } else {
      form.hidden = false;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      publish.disabled = true;
      setStatus("Publishing...");

      const { error } = await supabase.from("posts").insert({
        author_id: session.user.id,
        title: document.getElementById("title").value.trim(),
        body: document.getElementById("body").value.trim(),
        visibility: document.getElementById("visibility").value,
      });

      publish.disabled = false;
      if (error) {
        setStatus(error.message, true);
        return;
      }
      setStatus("Published. Opening the blog...");
      setTimeout(() => {
        location.href = "../";
      }, 800);
    });
  </script>
</body>
</html>
