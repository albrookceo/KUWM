<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Keeping up with Marcus</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
  <style>
    .login {
      max-width: 420px;
      margin: 64px auto;
      padding: 0 16px;
    }
    .login h1 {
      font-size: 2.4rem;
      text-transform: uppercase;
      margin: 0 0 8px;
    }
    .login label {
      display: block;
      font-weight: 700;
      margin: 24px 0 6px;
      text-transform: uppercase;
      font-size: 14px;
      letter-spacing: 0.06em;
    }
    .login input {
      width: 100%;
      font: inherit;
      font-size: 18px;
      padding: 12px;
      border: 2px solid var(--black);
    }
    .login button {
      margin-top: 16px;
      width: 100%;
      font: inherit;
      font-weight: 700;
      font-size: 18px;
      text-transform: uppercase;
      padding: 12px;
      background: var(--red);
      color: var(--white);
      border: 0;
      cursor: pointer;
    }
    .login button:disabled {
      opacity: 0.6;
      cursor: default;
    }
    .login .status {
      margin-top: 20px;
      min-height: 1.4em;
    }
    .login .status.error {
      color: var(--red);
    }
  </style>
</head>
<body>
  <header class="hero" style="min-height: auto; padding: 0;">
    <a class="logo-block" href="../">
      <span class="logo-main">KEEPING UP WITH MARCUS</span>
      <span class="logo-sub">ATX</span>
    </a>
  </header>

  <main class="login">
    <h1>Sign in</h1>
    <p>Members only. Enter your email and we'll send you a sign-in link. No password needed.</p>

    <div id="signed-out">
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required>
        <button id="send" type="submit">Email me a link</button>
      </form>
    </div>

    <div id="signed-in" hidden>
      <p>You're signed in as <strong id="who"></strong>.</p>
      <p><a href="../blog/" style="display: inline-block; padding: 12px 20px; background: var(--red); color: var(--white); font-weight: 700; font-size: 18px; text-transform: uppercase; text-decoration: none;">Go to the blog &rarr;</a></p>
      <button id="sign-out" type="button">Sign out</button>
    </div>

    <p id="status" class="status" role="status"></p>
  </main>

  <script type="module">
    import { supabase } from "../js/supabase.js";

    // Where the sign-in email should send people back to.
    // Only known destinations are allowed, so the link can't be pointed elsewhere.
    const destinations = { blog: "/blog/" };
    const params = new URLSearchParams(location.search);
    const returnPath = destinations[params.get("next")] ?? "/";

    const form = document.getElementById("login-form");
    const emailInput = document.getElementById("email");
    const sendButton = document.getElementById("send");
    const status = document.getElementById("status");
    const signedOut = document.getElementById("signed-out");
    const signedIn = document.getElementById("signed-in");
    const who = document.getElementById("who");

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle("error", isError);
    }

    function showSession(session) {
      const signedInNow = Boolean(session);
      signedOut.hidden = signedInNow;
      signedIn.hidden = !signedInNow;
      if (signedInNow) {
        who.textContent = session.user.email;
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = emailInput.value.trim();
      sendButton.disabled = true;
      setStatus("Sending link...");

      const { error } = await supabase.auth.signInWithOtp({
        email,
        options: {
          emailRedirectTo: `${location.origin}${returnPath}`,
        },
      });

      sendButton.disabled = false;
      if (error) {
        setStatus(error.message, true);
        return;
      }
      setStatus("Check your email for the sign-in link.");
    });

    document.getElementById("sign-out").addEventListener("click", async () => {
      await supabase.auth.signOut();
      setStatus("Signed out.");
    });

    supabase.auth.onAuthStateChange((_event, session) => {
      showSession(session);
    });

    const { data } = await supabase.auth.getSession();
    showSession(data.session);
  </script>
</body>
</html>
