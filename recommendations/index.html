<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NYC Recommendations | Keeping up with Marcus</title>
  <meta name="description" content="Favorite NYC recommendations sent in by friends of Marcus.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Limelight&family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --ink: #0c0f0e;
      --panel: #131917;
      --gold: #c9a24a;
      --gold-light: #e8cf86;
      --cream: #f3ead7;
      --muted: #a89f8a;
      --rust: #d9785f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--ink);
      color: var(--cream);
      font-family: "Josefin Sans", "Futura", "Century Gothic", sans-serif;
      font-weight: 400;
      line-height: 1.6;
    }

    /* Dusk sky behind the whole page, matching the TEXIT invite */
    .sky {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: linear-gradient(180deg, #1b3fd1 0%, #3d5fe0 40%, #8f93ea 72%, #c3bff2 100%);
    }

    /* Midtown skyline with lit windows, anchored to the bottom of the viewport */
    .skyline {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: auto;
      z-index: 0;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }

    /* Top bar: home link on the left, sign-out on the right */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .back {
      color: var(--cream);
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-decoration: none;
    }

    .back:hover {
      color: var(--gold-light);
    }

    .signout {
      font: inherit;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      background: none;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 6px 12px;
      cursor: pointer;
    }

    .signout[hidden] {
      display: none;
    }

    /* Stepped double-rule frame */
    .frame {
      position: relative;
      border: 2px solid var(--gold);
      padding: 10px;
      background: var(--panel);
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid var(--gold);
      pointer-events: none;
    }

    .inner {
      position: relative;
      text-align: center;
      padding: 48px 24px 40px;
      background:
        linear-gradient(180deg, rgba(201, 162, 74, 0.10), transparent 40%),
        rgba(19, 25, 23, 0.88);
    }

    /* Fan crest with the Empire State Building, same as the TEXIT invite */
    .crest {
      display: block;
      width: 240px;
      max-width: 70%;
      height: auto;
      margin: 0 auto 8px;
    }

    .kicker {
      margin: 0 0 12px;
      color: var(--gold-light);
      font-weight: 600;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      font-size: 0.8rem;
    }

    h1 {
      font-family: "Limelight", "Didot", serif;
      font-weight: 400;
      font-size: clamp(1.6rem, 5.2vw, 2.5rem);
      line-height: 1.1;
      margin: 0 0 8px;
      color: var(--gold);
      letter-spacing: 0.02em;
      overflow-wrap: break-word;
      text-shadow: 0 2px 0 #7a5d22;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 20px auto 24px;
      color: var(--gold);
      font-size: 0.9rem;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      width: 72px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }

    .divider::after {
      background: linear-gradient(270deg, transparent, var(--gold));
    }

    .lede {
      font-size: 1.1rem;
      max-width: 480px;
      margin: 0 auto 32px;
      font-weight: 300;
    }

    .status {
      min-height: 1.4em;
      margin: 0 0 16px;
      color: var(--gold-light);
    }

    .status.error {
      color: var(--rust);
    }

    /* Recommendations as deco rows between gold rules */
    .rec-list {
      list-style: none;
      padding: 0;
      margin: 0 0 8px;
      border-bottom: 1px solid var(--gold);
      text-align: left;
    }

    .rec-list li {
      padding: 20px 8px;
    }

    .rec-list li + li {
      border-top: 1px solid rgba(201, 162, 74, 0.35);
    }

    .rec-list h2 {
      font-family: "Limelight", "Didot", serif;
      font-weight: 400;
      font-size: 1.4rem;
      color: var(--gold);
      margin: 0 0 6px;
      letter-spacing: 0.04em;
    }

    .rec-list p {
      margin: 0;
      font-size: 1.05rem;
      white-space: pre-wrap;
    }

    .rec-list .delete {
      margin-top: 10px;
      font: inherit;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      background: none;
      border: 0;
      padding: 0;
      color: var(--rust);
      cursor: pointer;
      text-decoration: underline;
    }

    .empty {
      color: var(--muted);
      margin: 16px 0;
    }

    /* Add form */
    .add-form {
      margin-top: 36px;
      text-align: left;
    }

    .add-form h2 {
      font-family: "Limelight", "Didot", serif;
      font-weight: 400;
      font-size: 1.6rem;
      color: var(--gold);
      text-align: center;
      margin: 0 0 20px;
      letter-spacing: 0.04em;
    }

    .field {
      margin: 0 0 18px;
    }

    .field label {
      display: block;
      color: var(--gold);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin: 0 0 6px;
    }

    .field input,
    .field textarea {
      width: 100%;
      font: inherit;
      font-size: 1.05rem;
      padding: 10px;
      color: var(--cream);
      background: rgba(12, 15, 14, 0.6);
      border: 1px solid var(--gold);
    }

    .field input:focus,
    .field textarea:focus {
      outline: 2px solid var(--gold-light);
      outline-offset: 1px;
    }

    .field textarea {
      min-height: 140px;
      resize: vertical;
    }

    /* Gold stepped button, same as the RSVP button */
    .button {
      display: inline-block;
      font: inherit;
      color: var(--ink);
      background: var(--gold);
      border: 0;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-size: 0.9rem;
      padding: 16px 40px;
      cursor: pointer;
      clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px), 0 14px);
      transition: background 0.2s ease;
    }

    .button:hover:not(:disabled),
    .button:focus-visible {
      background: var(--gold-light);
    }

    .button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .button-row {
      text-align: center;
    }

    .signin-note {
      margin-top: 28px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .signin-note a {
      color: var(--gold-light);
    }
  </style>
</head>
<body>

  <main class="page">
    <div class="topbar">
      <a class="back" href="../">&larr; Keeping up with Marcus</a>
      <button id="signout" class="signout" type="button" hidden>Sign out</button>
    </div>

    <div class="frame">
      <div class="inner">
        <svg class="crest" viewBox="0 0 240 140" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#c9a24a" stroke-width="1.5">
          <!-- radiating fan, Chrysler Building crown style -->
          <g transform="translate(120 130)">
            <path d="M-110 0 A110 110 0 0 1 110 0"/>
            <path d="M-90 0 A90 90 0 0 1 90 0"/>
            <path d="M-70 0 A70 70 0 0 1 70 0"/>
            <path d="M-50 0 A50 50 0 0 1 50 0"/>
            <line x1="-50" y1="0" x2="50" y2="0"/>
            <line x1="-110" y1="0" x2="110" y2="0" stroke-width="2"/>
            <line x1="0" y1="0" x2="0" y2="-50" transform="rotate(-90)"/>

        <p class="kicker">Public list</p>
        <h1>NYC Recommendations</h1>

        <div class="divider" aria-hidden="true">&#9670;</div>

        <p class="lede">
          Favorite spots to eat, drink, see, and do in New York City, from friends of Marcus.
        </p>

        <p id="status" class="status" role="status"></p>
        <ul id="rec-list" class="rec-list"></ul>
        <p id="empty" class="empty" hidden>No recommendations yet. Be the first.</p>

        <section id="add-section" class="add-form" hidden>
          <h2>Add yours</h2>
          <form id="rec-form">
            <div class="field">
              <label for="place">Place</label>
              <input id="place" type="text" required maxlength="200" placeholder="Name of the spot">
            </div>
            <div class="field">
              <label for="why">Why you love it</label>
              <textarea id="why" maxlength="2000" placeholder="What to order, what to see, why it's worth going"></textarea>
            </div>
            <div class="button-row">
              <button id="add" class="button" type="submit">Add recommendation</button>
            </div>
          </form>
        </section>

        <p id="signed-out-note" class="signin-note" hidden>
          <a href="../login/?next=recommendations">Sign in</a> to add your own recommendation.
        </p>
      </div>
    </div>
  </main>

  <script type="module">
    import { supabase } from "../js/supabase.js";
    import { setupSignOut } from "../js/signout.js";
    setupSignOut(document.getElementById("signout"));

    const recList = document.getElementById("rec-list");
    const emptyEl = document.getElementById("empty");
    const statusEl = document.getElementById("status");
    const addSection = document.getElementById("add-section");
    const signedOutNote = document.getElementById("signed-out-note");
    const form = document.getElementById("rec-form");
    const addButton = document.getElementById("add");

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value;
      return div.innerHTML;
    }

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle("error", isError);
    }

    const { data: sessionData } = await supabase.auth.getSession();
    const session = sessionData.session;

    if (session) {
      addSection.hidden = false;
    } else {
      signedOutNote.hidden = false;
    }

    async function loadList() {
      const { data, error } = await supabase
        .from("recommendations")
        .select("id, place, body, author_id")
        .order("created_at", { ascending: false });

      if (error) {
        setStatus(error.message, true);
        return;
      }
      if (data.length === 0) {
        emptyEl.hidden = false;
        recList.innerHTML = "";
        return;
      }
      emptyEl.hidden = true;
      recList.innerHTML = data
        .map((rec) => {
          const mine = session && rec.author_id === session.user.id;
          const remove = mine
            ? `<button class="delete" type="button" data-id="${rec.id}">Remove</button>`
            : "";
          return `<li>
            <h2>${escapeHtml(rec.place)}</h2>
            ${rec.body ? `<p>${escapeHtml(rec.body)}</p>` : ""}
            ${remove}
          </li>`;
        })
        .join("");
    }

    recList.addEventListener("click", async (event) => {
      const button = event.target.closest(".delete");
      if (!button) return;
      button.disabled = true;
      const { error } = await supabase.from("recommendations").delete().eq("id", button.dataset.id);
      if (error) {
        setStatus(error.message, true);
        button.disabled = false;
        return;
      }
      loadList();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      addButton.disabled = true;
      setStatus("Adding...");

      const { error } = await supabase.from("recommendations").insert({
        author_id: session.user.id,
        place: document.getElementById("place").value.trim(),
        body: document.getElementById("why").value.trim(),
      });

      addButton.disabled = false;
      if (error) {
        setStatus(error.message, true);
        return;
      }
      form.reset();
      setStatus("Added.");
      loadList();
    });

    setStatus("Loading...");
    await loadList();
    if (statusEl.textContent === "Loading...") setStatus("");
  </script>
</body>
</html>
